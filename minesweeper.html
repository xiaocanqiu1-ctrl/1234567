<title>扫雷</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: centered single-column app — toolbar над сеткой, status bar под ней */
  :root {
    --bg: #e7ecf3;
    --panel: #f7f9fc;
    --panel-sunken: #d4dbe6;
    --cell: #c3cdda;
    --cell-hi: #eef2f8;
    --cell-lo: #9aa7b8;
    --revealed: #e9edf3;
    --revealed-edge: #cfd6e0;
    --fg: #1f2733;
    --muted: #5e6b7e;
    --accent: #2f6df0;
    --accent-ink: #ffffff;
    --danger: #e23b3b;
    --flag: #e23b3b;
    --n1:#2f6df0; --n2:#1f8a44; --n3:#e23b3b; --n4:#6b32c9;
    --n5:#9a4a10; --n6:#128b94; --n7:#2a2f3a; --n8:#7a8699;
    --shadow: rgba(31,39,51,.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121722; --panel:#1c2432; --panel-sunken:#131925;
      --cell:#2b3647; --cell-hi:#3b4860; --cell-lo:#182030;
      --revealed:#1a212d; --revealed-edge:#283142;
      --fg:#e7ecf3; --muted:#93a0b4; --accent:#4d84ff; --accent-ink:#0b1016;
      --danger:#ff5a5a; --flag:#ff5a5a;
      --n1:#6fa0ff; --n2:#4cce7b; --n3:#ff6b6b; --n4:#b388ff;
      --n5:#e0a15a; --n6:#45c6d0; --n7:#cdd5e2; --n8:#8795a9;
      --shadow: rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#121722; --panel:#1c2432; --panel-sunken:#131925;
    --cell:#2b3647; --cell-hi:#3b4860; --cell-lo:#182030;
    --revealed:#1a212d; --revealed-edge:#283142;
    --fg:#e7ecf3; --muted:#93a0b4; --accent:#4d84ff; --accent-ink:#0b1016;
    --danger:#ff5a5a; --flag:#ff5a5a;
    --n1:#6fa0ff; --n2:#4cce7b; --n3:#ff6b6b; --n4:#b388ff;
    --n5:#e0a15a; --n6:#45c6d0; --n7:#cdd5e2; --n8:#8795a9;
    --shadow: rgba(0,0,0,.4);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: clamp(14px, 4vw, 32px);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  h1 {
    font-size: clamp(22px, 6vw, 30px);
    font-weight: 800;
    letter-spacing: .12em;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  .subtitle { color: var(--muted); font-size: 13px; margin: 0 0 18px; letter-spacing:.02em; }

  .frame {
    background: var(--panel);
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 10px 30px -12px var(--shadow), 0 1px 0 rgba(255,255,255,.04) inset;
    max-width: 100%;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
  }
  .segmented {
    display: inline-flex;
    background: var(--panel-sunken);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }
  .segmented button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s, color .15s;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 2px 6px -2px var(--shadow);
  }

  .status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--panel-sunken);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 12px;
  }
  .readout {
    display: flex;
    align-items: center;
    gap: 7px;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 18px;
    min-width: 72px;
  }
  .readout.right { justify-content: flex-end; }
  .readout .ico { font-size: 16px; }
  .face {
    border: 0;
    background: var(--panel);
    width: 46px; height: 46px;
    border-radius: 50%;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 3px 8px -3px var(--shadow);
    transition: transform .1s;
    line-height: 1;
  }
  .face:active { transform: scale(.92); }

  .board-wrap { overflow-x: auto; max-width: 100%; }
  .board {
    display: grid;
    gap: 3px;
    margin: 0 auto;
    touch-action: manipulation;
  }
  .cell {
    width: var(--cs, 32px);
    height: var(--cs, 32px);
    border-radius: 6px;
    background: linear-gradient(145deg, var(--cell-hi), var(--cell));
    box-shadow: 0 1px 0 var(--cell-lo);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: calc(var(--cs, 32px) * .52);
    cursor: pointer;
    position: relative;
    font-variant-numeric: tabular-nums;
    transition: background .08s;
  }
  .cell:active { background: var(--cell); }
  .cell.flagged { color: var(--flag); }
  .cell.revealed {
    background: var(--revealed);
    box-shadow: inset 0 0 0 1px var(--revealed-edge);
    cursor: default;
  }
  .cell.mine.revealed { background: var(--danger); }
  .cell.mine-wrong { color: var(--muted); }
  .cell.exploded { background: var(--danger); animation: pop .3s; }
  @keyframes pop { 0%{ transform:scale(1.15);} 100%{ transform:scale(1);} }
  .n1{color:var(--n1)} .n2{color:var(--n2)} .n3{color:var(--n3)} .n4{color:var(--n4)}
  .n5{color:var(--n5)} .n6{color:var(--n6)} .n7{color:var(--n7)} .n8{color:var(--n8)}

  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 14px;
    line-height: 1.6;
    max-width: 44ch;
  }
  kbd {
    font-family: inherit;
    background: var(--panel-sunken);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
    font-weight: 600;
  }
  .flag-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 0;
    border-radius: 10px;
    padding: 7px 12px;
    background: var(--panel-sunken);
    color: var(--muted);
    font-weight: 600;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .flag-toggle[aria-pressed="true"] {
    background: var(--flag);
    color: #fff;
  }
  .banner {
    text-align: center;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: .04em;
    height: 22px;
    margin-bottom: 10px;
    transition: opacity .2s;
  }
  .banner.win { color: var(--n2); }
  .banner.lose { color: var(--danger); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>

<h1>扫雷</h1>
<p class="subtitle">MINESWEEPER · 经典扫雷</p>

<div class="frame">
  <div class="toolbar">
    <div class="segmented" id="difficulty" role="group" aria-label="难度">
      <button data-level="beginner" aria-pressed="true">初级</button>
      <button data-level="intermediate" aria-pressed="false">中级</button>
      <button data-level="expert" aria-pressed="false">高级</button>
    </div>
    <button class="flag-toggle" id="flagToggle" aria-pressed="false" title="插旗模式">🚩 插旗</button>
  </div>

  <div class="status">
    <div class="readout" id="mineCount" aria-label="剩余地雷"><span class="ico">💣</span><span id="mineNum">010</span></div>
    <button class="face" id="face" aria-label="重新开始">🙂</button>
    <div class="readout right" id="timer" aria-label="用时"><span id="timeNum">000</span><span class="ico">⏱️</span></div>
  </div>

  <div class="banner" id="banner" aria-live="polite"></div>

  <div class="board-wrap">
    <div class="board" id="board" aria-label="扫雷棋盘"></div>
  </div>
</div>

<p class="hint">
  电脑：左键翻开，<kbd>右键</kbd>插旗，双击数字可快速展开周围。<br>
  手机：点击翻开，开启 <strong>🚩插旗</strong> 后点击即插旗（或长按插旗）。
</p>

<script>
(function () {
  "use strict";

  var LEVELS = {
    beginner:     { rows: 9,  cols: 9,  mines: 10 },
    intermediate: { rows: 16, cols: 16, mines: 40 },
    expert:       { rows: 16, cols: 30, mines: 99 }
  };

  var boardEl = document.getElementById("board");
  var faceEl = document.getElementById("face");
  var mineNumEl = document.getElementById("mineNum");
  var timeNumEl = document.getElementById("timeNum");
  var bannerEl = document.getElementById("banner");
  var flagToggleEl = document.getElementById("flagToggle");
  var diffEl = document.getElementById("difficulty");

  var level = "beginner";
  var rows, cols, mines;
  var grid;           // array of cell objects
  var started = false; // first click placed mines?
  var over = false;
  var won = false;
  var revealedCount = 0;
  var flagsPlaced = 0;
  var flagMode = false;
  var timer = null;
  var seconds = 0;

  function pad3(n) { n = Math.max(0, Math.min(999, n)); return ("00" + n).slice(-3); }

  function idx(r, c) { return r * cols + c; }
  function inBounds(r, c) { return r >= 0 && r < rows && c >= 0 && c < cols; }

  function neighbors(r, c) {
    var out = [];
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        if (inBounds(r + dr, c + dc)) out.push([r + dr, c + dc]);
      }
    }
    return out;
  }

  function newGame() {
    var cfg = LEVELS[level];
    rows = cfg.rows; cols = cfg.cols; mines = cfg.mines;
    grid = [];
    for (var i = 0; i < rows * cols; i++) {
      grid.push({ mine: false, count: 0, revealed: false, flagged: false, el: null });
    }
    started = false;
    over = false;
    won = false;
    revealedCount = 0;
    flagsPlaced = 0;
    seconds = 0;
    stopTimer();
    timeNumEl.textContent = "000";
    faceEl.textContent = "🙂";
    bannerEl.textContent = "";
    bannerEl.className = "banner";
    updateMineCount();
    render();
  }

  function cellSize() {
    // fit board to viewport width
    var avail = Math.min(window.innerWidth - 56, 560);
    var gap = 3;
    var s = Math.floor((avail - gap * (cols - 1)) / cols);
    return Math.max(20, Math.min(38, s));
  }

  function render() {
    boardEl.style.setProperty("--cs", cellSize() + "px");
    boardEl.style.gridTemplateColumns = "repeat(" + cols + ", var(--cs))";
    boardEl.innerHTML = "";
    var frag = document.createDocumentFragment();
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var cell = grid[idx(r, c)];
        var el = document.createElement("div");
        el.className = "cell";
        el.setAttribute("data-r", r);
        el.setAttribute("data-c", c);
        cell.el = el;
        frag.appendChild(el);
      }
    }
    boardEl.appendChild(frag);
  }

  function placeMines(safeR, safeC) {
    // exclude the first-clicked cell AND its neighbors for a kinder opening
    var forbidden = {};
    forbidden[idx(safeR, safeC)] = true;
    neighbors(safeR, safeC).forEach(function (n) { forbidden[idx(n[0], n[1])] = true; });

    var spots = [];
    for (var i = 0; i < rows * cols; i++) {
      if (!forbidden[i]) spots.push(i);
    }
    // if board too small to exclude neighbors, fall back to excluding only the cell
    var need = mines;
    if (spots.length < need) {
      spots = [];
      for (var j = 0; j < rows * cols; j++) if (j !== idx(safeR, safeC)) spots.push(j);
    }
    // shuffle (Fisher-Yates) and take first `need`
    for (var k = spots.length - 1; k > 0; k--) {
      var m = Math.floor(Math.random() * (k + 1));
      var tmp = spots[k]; spots[k] = spots[m]; spots[m] = tmp;
    }
    for (var p = 0; p < need; p++) grid[spots[p]].mine = true;

    // compute counts
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        if (grid[idx(r, c)].mine) continue;
        var cnt = 0;
        neighbors(r, c).forEach(function (n) { if (grid[idx(n[0], n[1])].mine) cnt++; });
        grid[idx(r, c)].count = cnt;
      }
    }
  }

  function startTimer() {
    stopTimer();
    timer = setInterval(function () {
      seconds++;
      timeNumEl.textContent = pad3(seconds);
    }, 1000);
  }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  function updateMineCount() { mineNumEl.textContent = pad3(mines - flagsPlaced); }

  function paintCell(cell) {
    var el = cell.el;
    el.className = "cell";
    el.textContent = "";
    if (cell.flagged && !cell.revealed) {
      el.classList.add("flagged");
      el.textContent = "🚩";
      return;
    }
    if (!cell.revealed) return;
    el.classList.add("revealed");
    if (cell.mine) {
      el.classList.add("mine");
      el.textContent = "💣";
      return;
    }
    if (cell.count > 0) {
      el.classList.add("n" + cell.count);
      el.textContent = cell.count;
    }
  }

  function reveal(r, c) {
    var cell = grid[idx(r, c)];
    if (cell.revealed || cell.flagged) return;
    // flood fill using a stack
    var stack = [[r, c]];
    while (stack.length) {
      var cur = stack.pop();
      var cr = cur[0], cc = cur[1];
      var cl = grid[idx(cr, cc)];
      if (cl.revealed || cl.flagged) continue;
      cl.revealed = true;
      revealedCount++;
      paintCell(cl);
      if (!cl.mine && cl.count === 0) {
        neighbors(cr, cc).forEach(function (n) {
          var nc = grid[idx(n[0], n[1])];
          if (!nc.revealed && !nc.flagged && !nc.mine) stack.push([n[0], n[1]]);
          else if (!nc.revealed && !nc.flagged && nc.count > 0 && !nc.mine) {
            nc.revealed = true; revealedCount++; paintCell(nc);
          }
        });
      }
    }
  }

  function chord(r, c) {
    var cell = grid[idx(r, c)];
    if (!cell.revealed || cell.count === 0) return;
    var flagged = 0;
    var ns = neighbors(r, c);
    ns.forEach(function (n) { if (grid[idx(n[0], n[1])].flagged) flagged++; });
    if (flagged !== cell.count) return;
    ns.forEach(function (n) {
      var nc = grid[idx(n[0], n[1])];
      if (!nc.flagged && !nc.revealed) {
        if (nc.mine) { explode(n[0], n[1]); }
        else reveal(n[0], n[1]);
      }
    });
    if (!over) checkWin();
  }

  function explode(r, c) {
    over = true;
    stopTimer();
    faceEl.textContent = "😵";
    bannerEl.textContent = "踩雷了！";
    bannerEl.className = "banner lose";
    // reveal all mines
    for (var i = 0; i < grid.length; i++) {
      var cl = grid[i];
      if (cl.mine && !cl.flagged) { cl.revealed = true; paintCell(cl); }
      if (!cl.mine && cl.flagged) { // wrong flag
        cl.el.classList.add("mine-wrong");
        cl.el.textContent = "✖";
      }
    }
    grid[idx(r, c)].el.classList.add("exploded");
  }

  function checkWin() {
    if (revealedCount === rows * cols - mines) {
      over = true; won = true;
      stopTimer();
      faceEl.textContent = "😎";
      bannerEl.textContent = "通关！用时 " + seconds + " 秒 🎉";
      bannerEl.className = "banner win";
      // auto-flag remaining mines
      for (var i = 0; i < grid.length; i++) {
        if (grid[i].mine && !grid[i].flagged) { grid[i].flagged = true; paintCell(grid[i]); }
      }
      flagsPlaced = mines;
      updateMineCount();
    }
  }

  function handleReveal(r, c) {
    if (over) return;
    var cell = grid[idx(r, c)];
    if (cell.flagged) return;
    if (!started) {
      placeMines(r, c);
      started = true;
      startTimer();
    }
    if (cell.revealed) { chord(r, c); return; }
    if (cell.mine) { explode(r, c); return; }
    reveal(r, c);
    checkWin();
  }

  function handleFlag(r, c) {
    if (over) return;
    var cell = grid[idx(r, c)];
    if (cell.revealed) return;
    cell.flagged = !cell.flagged;
    flagsPlaced += cell.flagged ? 1 : -1;
    updateMineCount();
    paintCell(cell);
  }

  // ---- events ----
  var longPressTimer = null;
  var longPressFired = false;
  var touchMoved = false;

  function getRC(target) {
    var el = target.closest ? target.closest(".cell") : null;
    if (!el) return null;
    return [parseInt(el.getAttribute("data-r"), 10), parseInt(el.getAttribute("data-c"), 10)];
  }

  boardEl.addEventListener("click", function (e) {
    if (longPressFired) { longPressFired = false; return; }
    var rc = getRC(e.target);
    if (!rc) return;
    if (flagMode) handleFlag(rc[0], rc[1]);
    else handleReveal(rc[0], rc[1]);
  });

  boardEl.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    var rc = getRC(e.target);
    if (!rc) return;
    handleFlag(rc[0], rc[1]);
  });

  // long-press to flag on touch
  boardEl.addEventListener("touchstart", function (e) {
    var rc = getRC(e.target);
    if (!rc) return;
    touchMoved = false;
    longPressFired = false;
    longPressTimer = setTimeout(function () {
      longPressFired = true;
      if (navigator.vibrate) { try { navigator.vibrate(15); } catch (x) {} }
      handleFlag(rc[0], rc[1]);
    }, 380);
  }, { passive: true });

  boardEl.addEventListener("touchmove", function () {
    touchMoved = true;
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  }, { passive: true });

  boardEl.addEventListener("touchend", function () {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  });

  faceEl.addEventListener("click", newGame);

  flagToggleEl.addEventListener("click", function () {
    flagMode = !flagMode;
    flagToggleEl.setAttribute("aria-pressed", flagMode ? "true" : "false");
  });

  diffEl.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    var lv = btn.getAttribute("data-level");
    if (!lv || lv === level) { if (lv === level) newGame(); return; }
    level = lv;
    Array.prototype.forEach.call(diffEl.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", b === btn ? "true" : "false");
    });
    newGame();
  });

  var resizeRAF = null;
  window.addEventListener("resize", function () {
    if (resizeRAF) cancelAnimationFrame(resizeRAF);
    resizeRAF = requestAnimationFrame(function () {
      boardEl.style.setProperty("--cs", cellSize() + "px");
    });
  });

  newGame();
})();
</script>
